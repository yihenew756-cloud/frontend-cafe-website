<!DOCTYPE html><html lang="en">
    <head>

                <body><header>

                                                                                                                            <footer>
                                                                                                                                <p>&copy; 2026 My First Website</p>
                                                                                                                                </footer>

                                                                                                                                <script>
                                                                                                                                    function showMessage() {
                                                                                                                                            document.getElementById("message").textContent =
                                                                                                                                                        "Congratulations! Your JavaScript is working!";
                                                                                                                                                            }
                                                                                                                                                            </script>

                                                                                                                                                            </body>
                                                                                                                                                            </html>
